<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推广代运营 · 操盘控制台</title>
<style>
  :root{
    --bg:#0b0e14; --surface:#141922; --surface2:#1b2230; --surface3:#222b3b;
    --border:#2a3344; --border2:#374358;
    --text:#e8ecf3; --muted:#8d97a8; --muted2:#656f80;
    --accent:#2dd4a7; --accent-dim:rgba(45,212,167,.13); --accent-text:#7ff0d2;
    --amber:#f5b547; --amber-dim:rgba(245,181,71,.13);
    --blue:#5b8def; --blue-dim:rgba(91,141,239,.14);
    --violet:#a98bf5; --violet-dim:rgba(169,139,245,.14);
    --red:#f0706e; --red-dim:rgba(240,112,110,.13);
    --radius:14px; --radius-sm:9px; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  /* login */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:34px 30px;width:100%;max-width:380px;box-shadow:var(--shadow)}
  .login-card .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:720;margin-bottom:4px}
  .login-card .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .login-card .sub{font-size:12.5px;color:var(--muted2);margin-bottom:24px}
  .login-card label{font-size:12px;color:var(--muted);display:block;margin:14px 0 6px}
  .login-card input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
  .login-card input:focus{border-color:var(--accent)}
  .login-btns{display:flex;gap:10px;margin-top:22px}
  .login-btns .btn{flex:1}
  .login-msg{font-size:12.5px;margin-top:14px;min-height:18px;color:var(--amber);line-height:1.5}
  .cfg-warn{background:var(--amber-dim);border:1px solid var(--amber);color:var(--amber);border-radius:10px;padding:13px 15px;font-size:12.5px;line-height:1.6;margin-top:16px}
  /* app */
  .app{display:flex;min-height:100vh}
  .sidebar{width:216px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
  .brand h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .brand p{font-size:11px;color:var(--muted2);margin-top:4px;padding-left:18px}
  .nav{padding:10px;flex:1;overflow:auto}
  .nav button{width:100%;text-align:left;background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:2px;display:flex;align-items:center;gap:11px;font-family:inherit;transition:.14s}
  .nav button:hover{background:var(--surface2);color:var(--text)}
  .nav button.active{background:var(--accent-dim);color:var(--accent-text);font-weight:600}
  .nav button .ic{width:17px;text-align:center;font-size:15px}
  .nav button .ct{margin-left:auto;font-size:11px;color:var(--muted2);background:var(--surface2);padding:1px 7px;border-radius:20px}
  .nav button.active .ct{background:rgba(45,212,167,.2);color:var(--accent-text)}
  .side-foot{padding:12px;border-top:1px solid var(--border)}
  .who{font-size:12px;color:var(--muted);padding:4px 4px 10px;line-height:1.4}
  .who b{color:var(--text);font-weight:600}
  .who .role{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;background:var(--surface2);color:var(--muted2);margin-left:5px}
  .foot-btns{display:flex;gap:7px}
  .foot-btns button{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:7px;border-radius:8px;cursor:pointer;font-size:11.5px;font-family:inherit;transition:.14s}
  .foot-btns button:hover{border-color:var(--border2);color:var(--text)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{padding:17px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:rgba(11,14,20,.82);backdrop-filter:blur(10px);z-index:20}
  .topbar h2{font-size:17px;font-weight:650}
  .topbar .sub{font-size:12px;color:var(--muted2);margin-top:1px}
  .topbar .spacer{flex:1}
  .search{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text);font-size:13px;width:210px;font-family:inherit;outline:none}
  .search:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:#06231c;border:none;padding:9px 15px;border-radius:9px;font-weight:650;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.14s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--border2)}
  .content{padding:24px 26px 60px;max-width:1200px;width:100%}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;position:relative;overflow:hidden}
  .kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .kpi .val{font-size:27px;font-weight:730;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
  .kpi .meta{font-size:11.5px;color:var(--muted2);margin-top:5px}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .kpi.amber .bar{background:var(--amber)}.kpi.blue .bar{background:var(--blue)}.kpi.violet .bar{background:var(--violet)}
  .kpi.amber .val{color:var(--amber)}
  .prow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.prow{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .panel-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .panel-h h3{font-size:13.5px;font-weight:650}
  .panel-h .spacer{flex:1}
  .panel-b{padding:6px 0}
  .mini{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border)}
  .mini:last-child{border-bottom:none}
  .mini .nm{font-weight:600;font-size:13px}
  .mini .sb{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .mini .rt{margin-left:auto;text-align:right}
  .mini .amt{font-weight:680;font-variant-numeric:tabular-nums}
  .progress{height:5px;background:var(--surface3);border-radius:4px;overflow:hidden;margin-top:6px;width:120px}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:12px 16px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
  td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.clk{cursor:pointer;transition:.12s}
  tbody tr.clk:hover{background:var(--surface2)}
  .cell-main{font-weight:600}
  .cell-sub{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-green{background:var(--accent-dim);color:var(--accent-text)}
  .p-amber{background:var(--amber-dim);color:var(--amber)}
  .p-blue{background:var(--blue-dim);color:var(--blue)}
  .p-red{background:var(--red-dim);color:var(--red)}
  .p-gray{background:var(--surface3);color:var(--muted)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--surface3);color:var(--muted);margin:1px 2px 1px 0}
  .tag.b{background:var(--blue-dim);color:var(--blue)}
  .ready{display:inline-flex;gap:4px}
  .chk{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
  .chk.on{background:var(--accent-dim);color:var(--accent-text)}
  .chk.off{background:var(--surface3);color:var(--muted2)}
  .empty{padding:48px 20px;text-align:center;color:var(--muted2)}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
  .empty p{font-size:13px;margin-bottom:16px}
  .overlay{position:fixed;inset:0;background:rgba(5,7,11,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:540px;box-shadow:var(--shadow);animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center}
  .modal-h h3{font-size:16px;font-weight:680}
  .modal-h .x{margin-left:auto;background:var(--surface2);border:none;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:17px}
  .modal-h .x:hover{color:var(--text)}
  .modal-b{padding:20px 22px;max-height:62vh;overflow:auto}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--muted);font-weight:550}
  .field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:.14s;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface3)}
  .field textarea{resize:vertical;min-height:62px}
  .chkrow{display:flex;flex-wrap:wrap;gap:8px}
  .chkbox{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);padding:8px 12px;border-radius:9px;cursor:pointer;font-size:12.5px;user-select:none;transition:.14s}
  .chkbox:hover{border-color:var(--border2)}
  .chkbox.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-text);font-weight:600}
  .chkbox input{display:none}
  .modal-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
  .modal-f .del{background:none;border:none;color:var(--red);cursor:pointer;font-size:12.5px;font-family:inherit}
  .modal-f .del:hover{text-decoration:underline}
  .modal-f .spacer{flex:1}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:550;opacity:0;transition:.25s;z-index:200;box-shadow:var(--shadow);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .section-note{font-size:12px;color:var(--muted2);margin-bottom:16px;line-height:1.6;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:9px;padding:12px 15px}
  .pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .pkg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.14s;position:relative}
  .pkg:hover{border-color:var(--border2);transform:translateY(-2px)}
  .pkg .pn{font-size:14.5px;font-weight:680}
  .pkg .pp{font-size:24px;font-weight:750;margin:10px 0 3px;color:var(--accent-text);font-variant-numeric:tabular-nums}
  .pkg .pb{font-size:11.5px;color:var(--muted2)}
  .pkg .pd{font-size:12.5px;color:var(--muted);margin-top:11px;line-height:1.55}
  .briefs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.briefs{grid-template-columns:1fr}}
  .brief{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;cursor:pointer;transition:.14s}
  .brief:hover{border-color:var(--border2);transform:translateY(-2px)}
  .brief-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
  .bp-name{font-size:15px;font-weight:680}
  .bp-sub{font-size:11.5px;color:var(--muted2);margin-top:2px}
  .brief-h .pill{margin-left:auto}
  .brief-row{display:flex;gap:10px;font-size:12.5px;margin:5px 0}
  .brief-row .k{color:var(--muted2);flex-shrink:0;width:34px}
  .brief-row .v{color:#d4dae4}
  .brief-ints{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
  @media(max-width:720px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static}
    .nav{display:flex;flex-wrap:wrap;padding:8px;gap:4px}
    .nav button{width:auto}.nav button .ct{display:none}
    .search{width:140px}.fgrid{grid-template-columns:1fr}
    .content{padding:18px 16px 50px}.topbar{padding:14px 16px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="brand"><span class="dot"></span> 操盘控制台</div>
    <div class="sub">推广代运营 · 团队版</div>
    <div id="loginBody">
      <label>邮箱</label>
      <input id="li_email" type="email" autocomplete="username" placeholder="you@example.com">
      <label>密码</label>
      <input id="li_pw" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth('login')">
      <div class="login-btns">
        <button class="btn" onclick="doAuth('login')">登录</button>
        <button class="btn ghost" onclick="doAuth('signup')">注册</button>
      </div>
      <div class="login-msg" id="loginMsg"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none">
  <aside class="sidebar">
    <div class="brand"><h1><span class="dot"></span> 操盘控制台</h1><p>推广代运营 · 团队版</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="who">—</div>
      <div class="foot-btns">
        <button onclick="exportData()">↓ 备份</button>
        <button onclick="logout()">退出登录</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h2 id="pageTitle">概览</h2><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <input class="search" id="search" placeholder="搜索客户…" oninput="render()" style="display:none">
      <button class="btn" id="addBtn" onclick="quickAdd()">+ 新增</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-h"><h3 id="modalTitle">编辑</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f"><button class="del" id="delBtn" onclick="deleteCurrent()" style="display:none">删除</button><div class="spacer"></div><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveForm()">保存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.119.1/dist/umd/supabase.js"><\/script>');</script>
<script src="config.js"></script>
<script>
/* ============ config / supabase ============ */
const CFG=window.CONFIG||{};
let supa=null, user=null, profile=null, rtChannel=null;
const COLL_TYPE={clients:'client',campaigns:'campaign',payments:'payment',packages:'package',briefs:'brief'};
const TYPE_COLL={client:'clients',campaign:'campaigns',payment:'payments',package:'packages',brief:'briefs'};
let state={clients:[],campaigns:[],payments:[],packages:[],briefs:[],members:[],settings:{cur:'U'}};
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,10));}
const CUR=()=>state.settings.cur||'U';
function $(id){return document.getElementById(id);}

async function initApp(){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||/你的|YOUR_|xxxx/i.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)){
    showLogin(); $('loginBody').innerHTML='<div class="cfg-warn">⚠ 还没配置后端。请打开 <b>config.js</b>,填入你的 Supabase 项目 URL 和 anon key(见 DEPLOY.md 第 3 步),再刷新本页。</div>';
    return;
  }
  supa=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  supa.auth.onAuthStateChange((_e,sess)=>handleSession(sess));
  const {data:{session}}=await supa.auth.getSession();
  handleSession(session);
}
async function handleSession(session){
  if(session&&session.user){
    user=session.user;
    showApp();
    await ensureProfile();
    await loadAll();
    subscribe();
  }else{
    user=null; profile=null;
    if(rtChannel){try{supa.removeChannel(rtChannel);}catch(e){} rtChannel=null;}
    showLogin();
  }
}
function showLogin(){$('loginScreen').style.display='flex';$('app').style.display='none';}
function showApp(){$('loginScreen').style.display='none';$('app').style.display='flex';}

/* ============ auth ============ */
async function doAuth(mode){
  const email=$('li_email').value.trim(), pw=$('li_pw').value;
  if(!email||!pw){loginMsg('请填邮箱和密码');return;}
  loginMsg('处理中…');
  let res;
  try{
    res=(mode==='signup')?await supa.auth.signUp({email,password:pw}):await supa.auth.signInWithPassword({email,password:pw});
  }catch(e){loginMsg('出错:'+e.message);return;}
  if(res.error){loginMsg(res.error.message);return;}
  if(mode==='signup'&&!res.data.session){loginMsg('注册成功。如开启了邮箱验证,请查收邮件确认后再登录。');return;}
  loginMsg('');
}
async function logout(){ await supa.auth.signOut(); }
function loginMsg(m){$('loginMsg').textContent=m;}

async function ensureProfile(){
  let {data}=await supa.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!data){
    await supa.from('profiles').insert({id:user.id,email:user.email,name:(user.email||'').split('@')[0]});
    const r=await supa.from('profiles').select('*').eq('id',user.id).maybeSingle(); data=r.data;
  }
  profile=data||{name:(user.email||'').split('@')[0],role:'member'};
  renderAccount();
}
function renderAccount(){
  const w=$('who'); if(!w||!profile)return;
  w.innerHTML=`<b>${esc(profile.name||user.email)}</b><span class="role">${esc(profile.role||'member')}</span><br><span style="color:var(--muted2);font-size:11px">${esc(user.email)}</span>`;
}
function isAdmin(){return profile&&(profile.role==='owner'||profile.role==='admin');}

/* ============ data layer ============ */
async function loadAll(){
  let data=[],error=null,_from=0;for(;;){const _r=await supa.from('records').select('*').range(_from,_from+999);if(_r.error){error=_r.error;break;}const _p=_r.data||[];data=data.concat(_p);if(_p.length<1000)break;_from+=1000;}
  if(error){toast('加载失败:'+error.message);return;}
  const s={clients:[],campaigns:[],payments:[],packages:[],briefs:[],members:state.members||[],settings:{cur:'U'}};
  (data||[]).forEach(r=>{
    if(r.type==='settings'){s.settings={...s.settings,...(r.data||{})};}
    else{const c=TYPE_COLL[r.type]; if(c)s[c].push({id:r.id,...(r.data||{})});}
  });
  state=s;
  await loadMembers();
  render();
}

  else if(f.t==='textarea'){inner=`<textarea id="f_${f.k}">${esc(v!=null?v:'')}</textarea>`;}
  else if(f.t==='select'){inner=`<select id="f_${f.k}">${f.opt.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
  else if(f.t==='clientSel'){const opts=state.clients.map(c=>`<option value="${c.id}" ${c.id===v?'selected':''}>${esc(c.name)}</option>`).join('');inner=`<select id="f_${f.k}">${state.clients.length?opts:'<option value="">先去「客户」里建一个客户</option>'}</select>`;}
  else if(f.t==='checks'){const arr=Array.isArray(v)?v:[];inner=`<div class="chkrow" id="f_${f.k}">${f.opt.map(o=>`<label class="chkbox ${arr.includes(o)?'on':''}"><input type="checkbox" value="${o}" ${arr.includes(o)?'checked':''} onchange="this.parentElement.classList.toggle('on',this.checked)">${esc(o)}</label>`).join('')}</div>`;}
  else if(f.t==='bools'){inner=`<div class="chkrow">${f.opt.map(([key,lab])=>`<label class="chkbox ${item[key]?'on':''}"><input type="checkbox" id="f_${key}" ${item[key]?'checked':''} onchange="this.parentElement.classList.toggle('on',this.checked)">${esc(lab)}</label>`).join('')}</div>`;}
  return `<div class="field${full}"><label>${esc(f.l)}${f.req?' *':''}</label>${inner}</div>`;
}
async function saveForm(){
  const {coll,id}=editing;
  const data=id?{...state[coll].find(x=>x.id===id)}:{};
  delete data.id;
  for(const f of SCHEMAS[coll]){
    if(f.t==='checks'){const box=$('f_'+f.k);data[f.k]=[...box.querySelectorAll('input:checked')].map(i=>i.value);}
    else if(f.t==='bools'){f.opt.forEach(([key])=>{data[key]=$('f_'+key).checked;});}
    else{const e=$('f_'+f.k);if(!e)continue;let val=e.value;if(f.t==='number')val=val===''?0:Number(val);data[f.k]=val;}
  }
  if((coll==='clients'||coll==='campaigns'||coll==='packages'||coll==='briefs')&&!data[SCHEMAS[coll][0].k]){toast('请填'+SCHEMAS[coll][0].l.split(' ')[0]);return;}
  if(id){const rec=state[coll].find(x=>x.id===id);Object.assign(rec,data);render();await recUpdate(id,data);}
  else{const newId=uid();state[coll].push({id:newId,...data});render();await recInsert(COLL_TYPE[coll],newId,data);}
  closeModal();toast(id?'已更新':'已添加');
}
async function deleteCurrent(){
  const {coll,id}=editing;if(!id)return;
  if(!isAdmin()){toast('仅 owner/admin 可删除');return;}
  if(!confirm('确定删除?此操作不可撤销。'))return;
  state[coll]=state[coll].filter(x=>x.id!==id);render();closeModal();await recDelete(id);toast('已删除');
}
function closeModal(){$('overlay').classList.remove('show');editing={coll:null,id:null};}

async function loadPresets(){
  const have=new Set(state.briefs.map(b=>b.project));
  const add=presetBriefs().filter(b=>!have.has(b.project));
  if(!add.length){toast('预设已存在');return;}
  for(const data of add){const newId=uid();state.briefs.push({id:newId,...data});await recInsert('brief',newId,data);}
  render();toast('已载入 '+add.length+' 份预设');
}
